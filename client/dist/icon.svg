<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#1a1a2e" rx="80"/>
  
  <!-- Main Icon - Collaborative Space Symbol -->
  <g transform="translate(256, 256)">
    <!-- Center Circle -->
    <circle cx="0" cy="0" r="60" fill="url(#grad)" opacity="0.9"/>
    
    <!-- Connected Nodes -->
    <circle cx="-100" cy="-100" r="40" fill="url(#grad)" opacity="0.8"/>
    <circle cx="100" cy="-100" r="40" fill="url(#grad)" opacity="0.8"/>
    <circle cx="-100" cy="100" r="40" fill="url(#grad)" opacity="0.8"/>
    <circle cx="100" cy="100" r="40" fill="url(#grad)" opacity="0.8"/>
    
    <!-- Connection Lines -->
    <line x1="-100" y1="-100" x2="0" y2="0" stroke="url(#grad)" stroke-width="8" opacity="0.6"/>
    <line x1="100" y1="-100" x2="0" y2="0" stroke="url(#grad)" stroke-width="8" opacity="0.6"/>
    <line x1="-100" y1="100" x2="0" y2="0" stroke="url(#grad)" stroke-width="8" opacity="0.6"/>
    <line x1="100" y1="100" x2="0" y2="0" stroke="url(#grad)" stroke-width="8" opacity="0.6"/>
    
    <!-- Pen/Draw Symbol in Center -->
    <path d="M -20 -10 L 20 -10 L 25 10 L 20 20 L -20 20 L -25 10 Z" fill="white" opacity="0.9"/>
  </g>
</svg>
